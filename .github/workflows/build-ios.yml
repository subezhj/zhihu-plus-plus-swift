name: Build iOS SideStore IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          LATEST_XCODE=$(ls -d /Applications/Xcode* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting latest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run Preflight Check
        run: |
          chmod +x iosApp/scripts/*.sh
          ./iosApp/scripts/preflight.sh || true

      - name: Build SideStore IPA
        env:
          BUILD_VERSION: ${{ github.run_number }}
          MARKETING_VERSION: "0.3.1"
        run: |
          ./iosApp/scripts/build-sidestore-ipa.sh

      - name: Upload SideStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhihuPlusPlus-SideStore-IPA-v0.3.1-b${{ github.run_number }}
          path: build/iosApp/sidestore/ZhihuPlusPlus-SideStore.ipa
          if-no-files-found: error
